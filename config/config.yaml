#params from adaprive clustering 
/cuda_cone_rush_node:
  ros__parameters:
    # ================ Topics and Frames =================
    input_topic: /lidar_points
    segmented_topic: /segmented_points
    filtered_topic: /filtered_points
    cluster_topic: /clusters
    frame_id: "lidar_link"

    # ================ Zero Copy options =================
    zero_copy_enabled: false

    # ================ BARQ options =================
    BARQ_enabled: false      # Switch to BARQ to receive data (false to disable BARQ and use ROS2 as normal)
    BARQ_topic: /lidar_points
    BARQ_retry_delay_ms: 100
    BARQ_max_retries: 20
    BARQ_polling_rate_ms: 1.0  # [ms] ~1 kHz. MUST be a float literal: the
                               # parameter is declared double, and a bare `1`
                               # is an integer override that rcl rejects.
    BARQ_writer_timeout_ms: 1000  # Time in ms to check if the writer is alive

    # ================ Pipeline options =================
    filter: false
    segment: true
    clustering: true
    
    publishFilteredPc: false
    publishSegmentedPc: false
    publishCluster: true

    # ================ Debug options =================
    limitWarning_ms: 30
    nsight_max_iterations: 20
    
    # ================ Filtering XYZ options =================
    downFilterLimitX: -60.0
    upFilterLimitX: 60.0
    downFilterLimitY: -50.0
    upFilterLimitY: 50.0
    downFilterLimitZ: -5.0
    upFilterLimitZ: 5.0

    # ================ Segmentation options =================
    distanceThreshold: 0.05            # from the plane
    maxSegmentationDistance: 20.0        # how far the random points can be from the car to be considered for plane fitting (in meters)
    maxIterations: 80                 # by requiring the plane to be found form 3 points close to the car the max number of iterations can be reduce to 1/3
    probability: 0.75
    
    # ================ Clustering options =================
    minClusterSize : 3        # Minimum cluster size to filter out noise
    maxClusterSize : 500      # Maximum size for large objects
    voxelX: 0.3               # Down-sampling resolution in X (meters)
    voxelY: 0.3               # Down-sampling resolution in Y (meters)
    voxelZ: 0.3               # Down-sampling resolution in Z (meters)
    countThreshold: 1         # Minimum points per voxel

    clusterMaxX: 0.4
    clusterMaxY: 0.4
    clusterMaxZ: 0.4
    clusterMinX: -0.1
    clusterMinY: -0.1
    clusterMinZ: 0.05
    maxHeight: 1.0          # of the lowest point — ABSOLUTE z, not height over ground:
                            # if the ground plane is tilted in the lidar frame, ground z
                            # drifts each metre of x. Must stay above
                            # (ground z at max range) or far cones are silently dropped.
    
